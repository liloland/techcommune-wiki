name: Check pages
# Runs on every pull request. No secrets are used and the token is read-only.
on:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate every page
        run: python3 tools/lint.py
      - name: Run the tests
        run: python3 -m unittest discover -s tests
